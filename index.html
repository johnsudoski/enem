<style>

   Design system conforme especificação fornecida pelo usuário:

:root{
  --bg-primary:#1C1C1E;
  --bg-secondary:#2C2C2E;
  --red:#FF3B30;
  --red-hover:#FF6259;
  --yellow:#FFD60A;
  --green:#34C759;
  --purple:#AF52DE;
  --text-primary:#FFFFFF;
  --text-secondary:#8E8E93;
  --line:#3A3A3C;
  --radius:16px;
  --profile:#FF3B30; /* sobrescrita por JS por perfil no resultado */
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:radial-gradient(circle at top right, var(--bg-secondary) 0%, var(--bg-primary) 100%);
  color:var(--text-primary);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.app-shell{max-width:900px;margin:0 auto;padding:24px 20px 120px;min-height:100vh;}
.progress-wrap{position:sticky;top:0;z-index:30;padding:0 0 18px;display:none;}

.progress-bar{height:6px;background:var(--bg-secondary);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:var(--yellow);border-radius:99px;width:0%;transition:width .6s ease-out;}
.progress-label{font-size:12px;font-weight:700;color:var(--yellow);letter-spacing:2px;text-transform:uppercase;margin-top:10px;}

.screen{animation:fadeSlideUp .4s ease;}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion:reduce){.screen{animation:none;}}

.card{
  background:linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
  border-radius:24px;
  padding:48px 32px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
@media (max-width:600px){.card{padding:32px 20px;}}

/* ── INTRO ── */
.intro-icon{font-size:64px;text-align:center;animation:pulseGlow 2.2s ease-in-out infinite;}
@keyframes pulseGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,214,10,0));transform:scale(1);}50%{filter:drop-shadow(0 0 18px rgba(255,214,10,0.55));transform:scale(1.06);}}
.intro-headline{font:900 40px/1.15 'Inter';color:var(--text-primary);text-align:center;margin-top:20px;}
@media (max-width:600px){.intro-headline{font-size:30px;}}
.intro-sub{font:600 20px/1.4 'Inter';color:var(--yellow);text-align:center;margin-top:12px;}
.intro-desc{font:400 17px/1.6 'Inter';color:var(--text-secondary);text-align:center;max-width:600px;margin:20px auto 0;}
.stats-bar{display:flex;gap:24px;margin-top:36px;padding:22px;background:rgba(255,214,10,0.1);border:1px solid rgba(255,214,10,0.3);border-radius:16px;flex-wrap:wrap;justify-content:center;}
.stat-item{text-align:center;flex:1;min-width:110px;}
.stat-number{font:900 26px/1 'Inter';color:var(--text-primary);}
.stat-label{font:500 12px/1.3 'Inter';color:var(--text-secondary);margin-top:6px;}

.btn{
  display:block;width:100%;text-align:center;border:none;cursor:pointer;
  font:700 18px 'Inter';color:#fff;background:var(--red);
  padding:18px 40px;border-radius:12px;
  box-shadow:0 8px 24px rgba(255,59,48,0.4);
  transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
  text-decoration:none;
}
.btn:hover{background:var(--red-hover);transform:scale(1.02);box-shadow:0 12px 32px rgba(255,59,48,0.5);}
.btn:active{transform:scale(0.99);}
.btn-glow{animation:pulseGlow 2s infinite;}
.btn-wide{max-width:420px;margin:40px auto 0;}
.disclaimer{font:400 13px 'Inter';color:var(--text-secondary);text-align:center;margin-top:14px;}

/* ── PERGUNTAS ── */
.q-pretext{font:700 12px 'Inter';color:var(--yellow);letter-spacing:2px;text-transform:uppercase;}
.q-pretext.last{color:var(--red);}
.q-title{font:700 32px/1.3 'Inter';color:var(--text-primary);margin-top:14px;}
@media (max-width:600px){.q-title{font-size:24px;}}
.q-helper{font:400 15px/1.5 'Inter';color:var(--text-secondary);margin-top:14px;padding:14px 16px;background:rgba(255,214,10,0.05);border-left:4px solid var(--yellow);border-radius:8px;}
.q-options{margin-top:28px;display:flex;flex-direction:column;gap:14px;}
.q-option{
  display:flex;align-items:flex-start;gap:14px;

}
.q-option:hover{border-color:var(--red);background:rgba(255,59,48,0.1);transform:translateX(8px);}

.q-course{font:italic 400 13px 'Inter';color:var(--text-secondary);margin-top:6px;}

.objection-banner{

  max-width:900px;margin:0 auto;
}
@keyframes slideUpBanner{from{transform:translateY(100%);}to{transform:translateY(0);}}

.proc-step{font:500 17px 'Inter';color:var(--text-secondary);opacity:0;padding:6px 0;animation:fadeIn .5s ease forwards;}

.result-headline{font:900 38px/1.2 'Inter';color:var(--text-primary);margin-top:16px;}

.result-desc{font:400 17px/1.6 'Inter';color:var(--text-secondary);margin-top:16px;max-width:65ch;}
.section-title{font:800 22px 'Inter';color:var(--text-primary);margin-bottom:24px;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;background:color-mix(in srgb, var(--profile) 10%, transparent);border:2px solid color-mix(in srgb, var(--profile) 30%, transparent);border-radius:16px;padding:32px 20px;margin:44px 0;}

.reason-card{background:var(--bg-secondary);border-radius:12px;padding:26px;margin-bottom:16px;}

.harsh-box{background:color-mix(in srgb, var(--profile) 15%, transparent);border:2px solid var(--profile);border-radius:16px;padding:32px;font:600 18px/1.6 'Inter';color:var(--text-primary);margin:44px 0;}
.solution-box{background:linear-gradient(135deg, rgba(255,214,10,0.1) 0%, rgba(255,214,10,0.05) 100%);border:2px solid rgba(255,214,10,0.3);border-radius:16px;padding:32px;margin:44px 0;}

.solution-item .icon{color:var(--green);font-size:20px;flex-shrink:0;}
.solution-item h5{font:700 16px 'Inter';color:var(--text-primary);}
.solution-item p{font:400 14px/1.5 'Inter';color:var(--text-secondary);margin-top:4px;}
.urgency-box{background:rgba(255,59,48,0.15);border:2px solid var(--red);border-radius:16px;padding:36px;text-align:center;margin:44px 0;}
.urgency-box .icon{font-size:32px;}

.urgency-box p{font:400 15px/1.6 'Inter';color:var(--text-secondary);margin-top:10px;max-width:60ch;margin-left:auto;margin-right:auto;}
.countdown{font:900 44px 'Inter';color:var(--yellow);margin-top:16px;}
.countdown-label{font:600 13px 'Inter';color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;}

.cta-block .btn{background:#fff;color:var(--red);max-width:420px;margin:24px auto 0;box-shadow:0 10px 30px rgba(0,0,0,.25);}
.cta-block .btn:hover{background:#f2f2f2;}
.cta-price{font:700 15px 'Inter';color:#fff;margin-top:16px;}

.preview-grid{display:grid;grid-template-columns:1fr;gap:16px;margin:44px 0;}
.preview-card{background:var(--bg-secondary);border-radius:12px;padding:22px;border-left:4px solid var(--profile);}
.preview-card .tag{font:700 11px 'Inter';color:var(--profile);text-transform:uppercase;letter-spacing:1px;}

.faq-item{background:var(--bg-secondary);border-radius:12px;margin-bottom:12px;overflow:hidden;border-left:4px solid var(--profile);}

.sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:500;background:linear-gradient(90deg, var(--red) 0%, var(--red-hover) 100%);padding:16px 20px;box-shadow:0 -10px 40px rgba(0,0,0,0.35);}

.sticky-cta .price{font:700 15px 'Inter';color:#fff;}
.sticky-cta .btn{width:auto;padding:14px 28px;background:#fff;color:var(--red);box-shadow:none;margin:0;}
.sticky-cta .btn:hover{background:#f2f2f2;}
@media (max-width:600px){.sticky-cta-inner{flex-direction:column;}.sticky-cta .btn{width:100%;}}

/* ── VSL CINÉTICA (fecha o quiz, logo antes do botão de checkout) ──
   Implementação real da micro-VSL de 120s pedida pelo usuário: em vez
   de vídeo renderizado (sem b-roll disponível aqui), roda como
   sequência de tipografia cinética animada, ritmo automático, com
   opção de pular. Ver outputs/gabriel/desafio-reta-final-vsl/ pro
   roteiro completo formatado pra produção de vídeo real (com b-roll)
   quando o usuário quiser gravar de verdade. */
.vsl-wrap{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 10px;position:relative;}
.vsl-beat{font:900 clamp(28px,7vw,56px)/1.25 'Inter';color:var(--text-primary);opacity:0;transform:translateY(14px);transition:opacity .5s ease, transform .5s ease;max-width:720px;}
.vsl-beat.show{opacity:1;transform:translateY(0);}
.vsl-beat.red{color:var(--red);animation:vslPulse 1.2s ease-in-out infinite;}
@keyframes vslPulse{0%,100%{opacity:1;}50%{opacity:.72;}}
.vsl-beat.small{font-size:clamp(18px,4vw,24px);font-weight:500;color:var(--text-secondary);}
.vsl-beat.yellow{color:var(--yellow);}
.vsl-progress{position:absolute;top:0;left:0;right:0;height:4px;background:var(--bg-secondary);}
.vsl-progress-fill{height:100%;background:var(--red);width:0%;transition:width .1s linear;}
.vsl-skip{position:absolute;top:20px;right:0;font:600 13px 'Inter';color:var(--text-secondary);background:none;border:none;cursor:pointer;text-decoration:underline;}
.vsl-final{opacity:0;transform:translateY(14px);transition:opacity .6s ease, transform .6s ease;}
.vsl-final.show{opacity:1;transform:translateY(0);}
</style>
</head>

const state = { idx: 0, answers: {}, profile: null };
let hesitationTimer = null;

const screenEl = document.getElementById('screen');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const objectionBanner = document.getElementById('objectionBanner');

function setScreen(html){
  screenEl.classList.remove('screen');
  void screenEl.offsetWidth; // reinicia a animação fade+slide-up
  screenEl.innerHTML = html;
  screenEl.classList.add('screen');
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
  hideObjection();
}

function clearHesitationTimer(){
  if (hesitationTimer) { clearTimeout(hesitationTimer); hesitationTimer = null; }
}
function armHesitationTimer(text){
  clearHesitationTimer();
  hesitationTimer = setTimeout(() => showObjection(text), 10000);
}
function showObjection(text){
  objectionBanner.textContent = text;
  objectionBanner.hidden = false;
}
function hideObjection(){
  objectionBanner.hidden = true;
}

/* ---------- PERGUNTAS ---------- */
function renderQuestion(i){
  const q = QUESTIONS[i];
  progressWrap.classList.add('show');
  progressFill.style.width = q.progressPct + '%';
  progressLabel.textContent = q.progressLabel;

  const optionsHtml = q.options.map(opt => `
    <div class="q-option" onclick="answerQuestion('${q.category}','${opt.value}')">
      <span class="icon">${opt.icon}</span>
      <div class="body">
        <div class="opt-text">${opt.text}</div>
        <div class="opt-sub">${opt.sub}</div>
        ${opt.tag ? `<span class="q-tag" style="background:${opt.tagColor}">${opt.tag}</span>` : ''}
        ${opt.course ? `<div class="q-course">${opt.course}</div>` : ''}
      </div>
    </div>
  `).join('');

  setScreen(`
    <div class="card">
      <div class="q-pretext ${q.lastQuestion ? 'last' : ''}">${q.progressLabel}</div>
      <h2 class="q-title">${q.question}</h2>
      <div class="q-helper">${q.helper}</div>
      <div class="q-options">${optionsHtml}</div>
    </div>
  `);
  armHesitationTimer(q.objection);
}

function answerQuestion(category, value){
  clearHesitationTimer();
  state.answers[category] = value;
  if (state.idx < QUESTIONS.length - 1){
    state.idx++;
    renderQuestion(state.idx);
  } else {
    renderLead();
  }
}

  };
  if (LEAD_WEBHOOK_URL && !LEAD_WEBHOOK_URL.includes('COLE_AQUI')){
    fetch(LEAD_WEBHOOK_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify(dados)
    }).catch(() => { /* falha de rede não deve travar a experiência do estudante */ });

  renderProcessing();
}

/* ---------- VSL CINÉTICA DE FECHAMENTO (120s, roteiro do usuário) ----------
   Beats com timing (ms). O 1º e o 15º usam dado real calculado na hora
   (contagem regressiva real e o erro fatal do PRÓPRIO perfil do usuário),
   nunca número fixo. Ver outputs/gabriel/desafio-reta-final-vsl/ pro
   roteiro completo formatado pra produção de vídeo real com b-roll. */
function vslBeats(){
  return [
    {text:() => `Faltam ${diasAteProva()} dias pro ENEM.`, cls:'red', dur:3200},
    {text:'Você tem um plano... ou só esperança?', cls:'', dur:3000},
    {text:'Porque esperança não aprova ninguém.', cls:'red', dur:2800},
    {text:'Você já percebeu que não dá tempo de revisar tudo?', cls:'small', dur:2600},
    {text:'Que decorar fórmula na véspera não funciona?', cls:'small', dur:2600},
    {text:'Que entrar na prova sem estratégia é apostar tudo na sorte?', cls:'small', dur:3000},
    {text:'5.055.818 pessoas fazem o ENEM em 2026.', cls:'yellow', dur:2800},
    {text:'A maioria não sabe por onde começar — não por falta de esforço. Por falta de prioridade clara.', cls:'small', dur:3400},
    {text:'Os aprovados não estudam mais.', cls:'', dur:2200},
    {text:'Eles estudam CERTO.', cls:'red', dur:2200},
    {text:'Não decoram tudo — dominam o que REALMENTE cai.', cls:'small', dur:3000},
    {text:'Não entram em pânico — treinaram o cérebro pra performar sob pressão.', cls:'small', dur:3200},
    {text:'E tudo isso em 21 dias.', cls:'yellow', dur:2400},
    {text:'Não por mágica. Por método.', cls:'red', dur:2600},
    {text:() => `Seu diagnóstico já mostrou: ${PROFILES[state.profile].erroFatal.toLowerCase()}.`, cls:'small', dur:3400},
    {text:'Agora falta um passo.', cls:'', dur:2200}
  ];
}

let vslTimer = null;
let vslObserver = null;
let vslPlayed = false;

function setupVslObserver(){
  const wrap = document.getElementById('vslWrap');
  if (!wrap) return;
  vslObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting && !vslPlayed){
        vslPlayed = true;
        playVslBeat(0);
        vslObserver.disconnect();
      }
    });
  }, {threshold: 0.5});
  vslObserver.observe(wrap);
}

function playVslBeat(i){
  const beats = vslBeats();
  const beatEl = document.getElementById('vslBeat');
  const fillEl = document.getElementById('vslProgressFill');
  if (!beatEl || i >= beats.length){ revealVslFinal(); return; }

  const beat = beats[i];
  const text = typeof beat.text === 'function' ? beat.text() : beat.text;
  beatEl.className = 'vsl-beat' + (beat.cls ? ' ' + beat.cls : '');
  beatEl.textContent = text;
  if (fillEl) fillEl.style.width = Math.round(((i + 1) / beats.length) * 100) + '%';

  requestAnimationFrame(() => beatEl.classList.add('show'));

  vslTimer = setTimeout(() => {
    beatEl.classList.remove('show');
    setTimeout(() => playVslBeat(i + 1), 300);
  }, beat.dur);
}

function revealVslFinal(){
  const beatEl = document.getElementById('vslBeat');
  const finalEl = document.getElementById('vslFinal');
  const skipBtn = document.getElementById('vslSkipBtn');
  if (beatEl) beatEl.style.display = 'none';
  if (skipBtn) skipBtn.style.display = 'none';
  if (finalEl) finalEl.classList.add('show');
}

function skipVsl(){
  clearTimeout(vslTimer);
  if (vslObserver) vslObserver.disconnect();
  vslPlayed = true;
  revealVslFinal();
}

function goToCheckout(){
  if (TICTO_CHECKOUT_URL && !TICTO_CHECKOUT_URL.includes('COLE_AQUI')){
    window.location.href = TICTO_CHECKOUT_URL;
  } else {
    alert('Aqui entra o link real do checkout da Ticto — trocar TICTO_CHECKOUT_URL no topo do <script>.');
  }
}
